services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/parking.db
    volumes:
      - parking-mvp-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8443:80"

volumes:
  parking-mvp-data:
